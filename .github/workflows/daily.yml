name: Generate Daily Newspaper

on:
  schedule:
    - cron: '0 20 * * *' # 7:00 AM Sydney Time
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python generate.py
      - name: Publish Daily PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Daily Edition
          files: dist/The_Morning_Dispatch_Latest.pdf
